buildscript {
    dependencies {
        classpath group: "com.liferay", name: "com.liferay.gradle.plugins", version: "latest.release"
    }
    repositories {
        maven {
            url "https://repository-cdn.liferay.com/nexus/content/groups/public"
        }
    }
}

apply plugin: "com.liferay.plugin"

def liferayHome = System.getenv("LIFERAY_HOME") ?: "/root/vec/bundles"
def applicationListApiFiles = files(
    fileTree(dir: "${liferayHome}/osgi/modules", include: "com.liferay.application.list.api*.jar"),
    fileTree(dir: "${liferayHome}/osgi/portal", include: "com.liferay.application.list.api*.jar"),
    fileTree(dir: "${liferayHome}/osgi/static", include: "com.liferay.application.list.api*.jar"),
    fileTree(dir: "${liferayHome}/tools/sdk/dist", include: "com.liferay.application.list.api*.jar")
)
def osgiMetatypeAnnotationsFiles = files(
    fileTree(dir: "${liferayHome}/osgi/modules", include: "org.osgi.service.metatype.annotations*.jar"),
    fileTree(dir: "${liferayHome}/osgi/portal", include: "org.osgi.service.metatype.annotations*.jar"),
    fileTree(dir: "${liferayHome}/osgi/static", include: "org.osgi.service.metatype.annotations*.jar"),
    fileTree(dir: "${liferayHome}/tools/sdk/dist", include: "org.osgi.service.metatype.annotations*.jar")
)
def mailApiIncludes = ["mail*.jar", "jakarta.mail*.jar", "javax.mail*.jar", "com.sun.mail*.jar"]
def mailApiFiles = files(
    fileTree(dir: "${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib", include: mailApiIncludes),
    fileTree(dir: "${liferayHome}/tomcat/webapps/ROOT/WEB-INF/lib", include: mailApiIncludes),
    fileTree(dir: "${liferayHome}/tomcat/lib", include: mailApiIncludes)
)

repositories {
    maven {
        url "https://repository-cdn.liferay.com/nexus/content/groups/public"
    }
}

dependencies {
    compileOnly files("${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/portal-kernel.jar")
    compileOnly files("${liferayHome}/tomcat/lib/servlet-api.jar")
    compileOnly files("${rootDir}/../libs/osgi-annotations.jar")
    compileOnly files("${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/com.liferay.petra.function.jar")

    // Cho phép compile local khi không có full Liferay bundle. Trên server vẫn
    // ưu tiên đúng các JAR trong LIFERAY_HOME như trước.
    if (!file("${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/portal-kernel.jar").exists()) {
        compileOnly group: "com.liferay.portal", name: "release.portal.api", version: "7.4.3.132"
    }

    compileOnly group: "javax.ws.rs", name: "javax.ws.rs-api", version: "2.1"
    compileOnly group: "javax.portlet", name: "portlet-api", version: "2.0"
    compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
    compileOnly group: "org.osgi", name: "org.osgi.core", version: "6.0.0"
    compileOnly group: "org.osgi", name: "org.osgi.service.cm", version: "1.6.0"

    // portal.kernel and osgi-annotations already provided via local jars above
    if (applicationListApiFiles.files.empty) {
        compileOnly group: "com.liferay", name: "com.liferay.application.list.api", version: "13.1.3"
    }
    else {
        compileOnly applicationListApiFiles
    }
    if (osgiMetatypeAnnotationsFiles.files.empty) {
        compileOnly group: "org.osgi", name: "org.osgi.service.metatype.annotations", version: "1.4.0"
    }
    else {
        compileOnly osgiMetatypeAnnotationsFiles
    }
    if (mailApiFiles.files.empty) {
        compileOnly group: "com.sun.mail", name: "jakarta.mail", version: "1.6.7"
    }
    else {
        compileOnly mailApiFiles
    }
    compileOnly fileTree(dir: "${liferayHome}/osgi/modules", include: "com.liferay.portal.editor.configuration.api*.jar")
    compileOnly fileTree(
        dir: "${liferayHome}/osgi/modules",
        include: [
            "com.liferay.fragment.api*.jar",
            "com.liferay.journal.api*.jar",
            "com.liferay.message.boards.api*.jar",
            "com.liferay.portal.workflow.api*.jar"
        ]
    )
    compileOnly fileTree(
        dir: "${liferayHome}/osgi/portal",
        include: [
            "com.liferay.fragment.api*.jar",
            "com.liferay.journal.api*.jar",
            "com.liferay.message.boards.api*.jar",
            "com.liferay.portal.workflow.api*.jar"
        ]
    )
    compileOnly fileTree(
        dir: "${liferayHome}/osgi/static",
        include: "com.liferay.portal.configuration.persistence.api*.jar"
    )
    compileOnly group: "com.liferay", name: "com.liferay.dynamic.data.mapping.api", version: "latest.release"
}

tasks.named("buildCSS").configure { enabled = false }
tasks.named("copyCSS").configure { enabled = false }
