map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream milestone_windows_nginx {
    server 10.2.18.11:80;
    keepalive 32;
}

# ── Liferay backend (load balancing 2 node) ──────────────────────
upstream liferay_backend {
    # Sticky session: pin mỗi client về 1 node (an toàn khi chưa cấu hình
    # session replication giữa 2 server). Đổi sang round-robin bằng cách
    # bỏ dòng ip_hash nếu đã bật clustering/session replication.
    ip_hash;

    # max_fails: số lần lỗi trong fail_timeout thì coi node là "down".
    # fail_timeout: vừa là cửa sổ đếm lỗi, vừa là thời gian tạm loại node.
    server 10.2.18.29:8080 max_fails=3 fail_timeout=30s;
    server 10.2.18.31:8080 max_fails=3 fail_timeout=30s;

    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────
server {
    listen 80;
    server_name portal.tctvec.vn;
    return 301 https://$host$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name portal.tctvec.vn;

    # ── SSL Certificate ──────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/tctvec_fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/privatekey.key;

    # ── SSL Settings ─────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Logging ──────────────────────────────────────────────────
    access_log /var/log/nginx/portal.access.log;
    error_log  /var/log/nginx/portal.error.log;

    # ── Upload / Body ─────────────────────────────────────────────
    client_max_body_size 20G;

    # ── Buffer ───────────────────────────────────────────────────
    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # ── Timeout ──────────────────────────────────────────────────
    proxy_connect_timeout   10s;
    proxy_send_timeout      3600s;
    proxy_read_timeout      3600s;
    client_body_timeout     3600s;

    # ── Main location ─────────────────────────────────────────────
    location / {
        # ── BYPASS (không rewrite) ────────────────────────────────
        set $bypass 0;
        # Intranet / admin
        if ($uri ~ ^/web/intranet)    { set $bypass 1; }
        if ($uri ~ ^/web/admin)       { set $bypass 1; }
        if ($uri ~ ^/en/web/intranet) { set $bypass 1; }
        if ($uri ~ ^/en/web/admin)    { set $bypass 1; }
        # Liferay internals
        if ($uri ~ ^/o/)         { set $bypass 1; }
        if ($uri ~ ^/c/)         { set $bypass 1; }
        if ($uri ~ ^/documents/) { set $bypass 1; }
        # Đã có prefix rồi → không rewrite nữa
        if ($uri ~ ^/web/guest)    { set $bypass 1; }
        if ($uri ~ ^/en/web/guest) { set $bypass 1; }

        # ── REWRITE (chỉ khi bypass = 0) ──────────────────────────
        if ($bypass = 2) {
            rewrite ^/$          /web/guest/      break;
            rewrite ^/en/?$      /web/guest/      break;
            rewrite ^/en/(.+)$   /web/guest/$1    break;
            rewrite ^/(.+)$      /web/guest/$1    break;
        }

        # ── PROXY ─────────────────────────────────────────────────
        proxy_pass         http://liferay_backend;
        proxy_http_version 1.1;

        # ── Failover: nếu node lỗi/timeout thì thử node còn lại ───
        # Chỉ retry với request idempotent (GET/HEAD...) để tránh
        # double-submit POST. Bỏ comment "non_idempotent" nếu muốn
        # retry cả POST.
        proxy_next_upstream         error timeout http_502 http_503 http_504; # non_idempotent
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 30s;

        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Port  443;
        proxy_set_header   X-Forwarded-Host  $host;

        # proxy_redirect ~^(https?://[^/]+)/web/guest/(.*)$    $1/$2;
        # proxy_redirect ~^(https?://[^/]+)/en/web/guest/(.*)$ $1/$2;
    }

    # ── WebSocket — Liferay notifications ────────────────────────
    location /o/frontend-js-web/loader/ {
        proxy_pass         http://liferay_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    location = /o/its {
        return 301 /o/its/;
    }

    # ── Milestone API ───────────────────────────────────────────────
    location /o/its/api/ {
        proxy_pass http://milestone_windows_nginx/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Milestone HLS ───────────────────────────────────────────────
    location /o/its/hls/ {
        proxy_pass http://milestone_windows_nginx/hls/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # ── Milestone Thumbnail ─────────────────────────────────────────
    location /o/its/thumbnails/ {
        proxy_pass http://milestone_windows_nginx/thumbnails/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    location /o/its/ {
        proxy_pass http://milestone_windows_nginx/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    location /ttns/ {
        proxy_pass http://10.2.18.21:3109/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
