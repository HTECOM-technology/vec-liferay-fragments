<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử hội thoại AI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f6f8;
      color: #272833;
      min-height: 100vh;
    }

    /* ── Header ── */
    .app-header {
      background: #1c2b4a;
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .app-header h1 { font-size: 17px; font-weight: 600; flex: 1; }
    .btn-back {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
    }
    .btn-back:hover { background: rgba(255,255,255,.15); }
    .btn-back.visible { display: inline-flex; align-items: center; }

    /* ── Toolbar ── */
    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e7e7ed;
      padding: 12px 24px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 200px;
      padding: 7px 12px;
      border: 1px solid #cdced9;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    .toolbar input[type="search"]:focus { border-color: #0b5fff; }
    .toolbar select {
      padding: 7px 10px;
      border: 1px solid #cdced9;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
      cursor: pointer;
      outline: none;
    }
    .toolbar select:focus { border-color: #0b5fff; }
    .btn-search {
      padding: 7px 18px;
      background: #0b5fff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-search:hover { background: #0a4ed6; }

    /* ── Content ── */
    .content { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }

    /* ── Status / empty ── */
    .status-msg {
      text-align: center;
      padding: 48px 0;
      color: #6b6c7e;
      font-size: 15px;
    }

    /* ── Conversation list ── */
    .conv-list { display: flex; flex-direction: column; gap: 10px; }

    .conv-card {
      background: #fff;
      border: 1px solid #e7e7ed;
      border-radius: 8px;
      padding: 16px 20px;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 16px;
      align-items: start;
    }
    .conv-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); border-color: #0b5fff; }
    .conv-card-id {
      font-size: 13px;
      font-weight: 600;
      color: #0b5fff;
      font-family: monospace;
      grid-column: 1;
    }
    .conv-card-contact {
      font-size: 12px;
      color: #6b6c7e;
      grid-column: 1;
      margin-top: 2px;
    }
    .conv-card-count {
      grid-column: 2;
      grid-row: 1 / 3;
      align-self: center;
      background: #e9f0ff;
      color: #0b5fff;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .conv-card-date {
      font-size: 11px;
      color: #a7a9bc;
      grid-column: 1;
      margin-top: 6px;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid #cdced9;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
    }
    .pagination button:disabled { opacity: .4; cursor: default; }
    .pagination button:not(:disabled):hover { background: #f0f3ff; border-color: #0b5fff; }
    .pagination .page-info { font-size: 13px; color: #6b6c7e; min-width: 80px; text-align: center; }

    /* ── Detail view ── */
    #detail-view { display: none; }

    .detail-meta {
      background: #fff;
      border: 1px solid #e7e7ed;
      border-radius: 8px;
      padding: 14px 20px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #6b6c7e;
    }
    .detail-meta strong { color: #272833; font-family: monospace; }

    .messages { display: flex; flex-direction: column; gap: 10px; }

    .msg {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .msg.role-ai { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .role-user .msg-avatar { background: #c8d7ff; color: #0b5fff; }
    .role-ai .msg-avatar   { background: #edf9f0; color: #287d3c; }
    .role-agent .msg-avatar { background: #fff4ec; color: #b95000; }

    .msg-bubble {
      background: #fff;
      border: 1px solid #e7e7ed;
      border-radius: 10px;
      padding: 10px 14px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .role-ai .msg-bubble { background: #f0f9ff; border-color: #b8deff; }
    .role-agent .msg-bubble { background: #fff9f0; border-color: #ffd8b0; }

    .msg-time {
      font-size: 11px;
      color: #a7a9bc;
      margin-top: 4px;
    }
    .msg-meta { display: flex; flex-direction: column; }
    .role-ai .msg-meta { align-items: flex-end; }

    .load-more-wrap { text-align: center; margin-top: 20px; }
    .btn-load-more {
      padding: 9px 28px;
      border: 1px solid #0b5fff;
      color: #0b5fff;
      background: #fff;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-load-more:hover { background: #f0f3ff; }
    .btn-load-more:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>

<header class="app-header">
  <button class="btn-back" id="btnBack" title="Quay lại">&#8592;</button>
  <h1 id="pageTitle">Lịch sử hội thoại AI</h1>
</header>

<!-- List view -->
<div id="list-view">
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Tìm theo contactId hoặc conversationId…">
    <select id="orderBySelect">
      <option value="desc">Mới nhất trước</option>
      <option value="asc">Cũ nhất trước</option>
    </select>
    <button class="btn-search" id="btnSearch">Tìm kiếm</button>
  </div>
  <div class="content">
    <div id="convList" class="conv-list"></div>
    <div class="pagination" id="pagination" style="display:none">
      <button id="btnPrev" disabled>&#8592; Trước</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="btnNext">Tiếp &#8594;</button>
    </div>
  </div>
</div>

<!-- Detail view -->
<div id="detail-view">
  <div class="content">
    <div class="detail-meta" id="detailMeta"></div>
    <div class="messages" id="messageList"></div>
    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="btn-load-more" id="btnLoadMore">Xem thêm tin nhắn</button>
    </div>
  </div>
</div>

<script>
  const API = '/o/vec-webhook/conversations';

  const state = {
    list:   { page: 1, pageSize: 20, total: 0, search: '', orderBy: 'desc' },
    detail: { conversationId: null, contactId: null, page: 1, pageSize: 20, total: 0 }
  };

  // ── Elements ──
  const $ = (id) => document.getElementById(id);
  const listView   = $('list-view');
  const detailView = $('detail-view');
  const btnBack    = $('btnBack');
  const pageTitle  = $('pageTitle');

  // ── Helpers ──
  function shortId(id) {
    return id && id.length > 32 ? id.substring(0, 32) + '…' : (id || '—');
  }

  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('vi-VN', { hour12: false });
  }

  function showLoading(container) {
    container.innerHTML = '<div class="status-msg">Đang tải…</div>';
  }

  function showError(container, msg) {
    container.innerHTML = '<div class="status-msg" style="color:#da1414">' + msg + '</div>';
  }

  // ── List view ──
  async function loadConversations() {
    const { page, pageSize, search, orderBy } = state.list;
    const params = new URLSearchParams({ page, pageSize, orderBy });
    if (search) params.set('search', search);

    const container = $('convList');
    showLoading(container);
    $('pagination').style.display = 'none';

    try {
      const res = await fetch(API + '?' + params);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      state.list.total = data.total;
      renderConversations(data.items, container);
      renderPagination();
    } catch (e) {
      showError(container, 'Không tải được dữ liệu: ' + e.message);
    }
  }

  function renderConversations(items, container) {
    if (!items || items.length === 0) {
      container.innerHTML = '<div class="status-msg">Không có hội thoại nào.</div>';
      return;
    }

    container.innerHTML = '';

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'conv-card';
      card.innerHTML =
        '<div class="conv-card-id" title="' + (item.conversationId || '') + '">' +
          shortId(item.conversationId) +
        '</div>' +
        '<div class="conv-card-count">' + (item.messageCount || 0) + ' tin nhắn</div>' +
        '<div class="conv-card-contact">Người nhắn: ' + (item.contactId || '—') + '</div>' +
        '<div class="conv-card-date">Lần cuối: ' + formatDate(item.lastMessageDate) + '</div>';

      card.addEventListener('click', () => openDetail(item));
      container.appendChild(card);
    });
  }

  function renderPagination() {
    const { page, pageSize, total } = state.list;
    const totalPages = Math.ceil(total / pageSize);

    if (totalPages <= 1) {
      $('pagination').style.display = 'none';
      return;
    }

    $('pagination').style.display = 'flex';
    $('pageInfo').textContent = 'Trang ' + page + ' / ' + totalPages + ' (' + total + ')';
    $('btnPrev').disabled = page <= 1;
    $('btnNext').disabled = page >= totalPages;
  }

  $('btnPrev').addEventListener('click', () => {
    state.list.page--;
    loadConversations();
  });

  $('btnNext').addEventListener('click', () => {
    state.list.page++;
    loadConversations();
  });

  $('btnSearch').addEventListener('click', () => {
    state.list.search  = $('searchInput').value.trim();
    state.list.orderBy = $('orderBySelect').value;
    state.list.page    = 1;
    loadConversations();
  });

  $('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') $('btnSearch').click();
  });

  // ── Detail view ──
  async function openDetail(conv) {
    state.detail.conversationId = conv.conversationId;
    state.detail.contactId      = conv.contactId;
    state.detail.page           = 1;
    state.detail.total          = 0;

    listView.style.display   = 'none';
    detailView.style.display = 'block';
    btnBack.classList.add('visible');
    pageTitle.textContent = 'Hội thoại ' + shortId(conv.conversationId);

    $('detailMeta').innerHTML =
      'conversationId: <strong>' + conv.conversationId + '</strong><br>' +
      'contactId: <strong>' + (conv.contactId || '—') + '</strong> &nbsp;|&nbsp; ' +
      'Bot: <strong>' + (conv.botId || '—') + '</strong>';

    $('messageList').innerHTML = '';
    $('loadMoreWrap').style.display = 'none';

    await loadMessages();
  }

  async function loadMessages() {
    const { conversationId, page, pageSize } = state.detail;
    const params = new URLSearchParams({ page, pageSize });
    const container = $('messageList');
    const btnMore = $('btnLoadMore');

    btnMore.disabled = true;

    try {
      const res = await fetch(API + '/' + encodeURIComponent(conversationId) + '/messages?' + params);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      state.detail.total = data.total;

      if (page === 1 && (!data.items || data.items.length === 0)) {
        showError(container, 'Không có tin nhắn nào.');
        return;
      }

      appendMessages(data.items, container);

      if (data.hasMore) {
        $('loadMoreWrap').style.display = 'block';
        btnMore.disabled = false;
      } else {
        $('loadMoreWrap').style.display = 'none';
      }
    } catch (e) {
      showError(container, 'Không tải được tin nhắn: ' + e.message);
    }
  }

  function appendMessages(items, container) {
    items.forEach(msg => {
      const role = msg.messageRole || 'unknown';
      const roleClass =
        role === 'user'          ? 'role-user'  :
        role === 'assistant'     ? 'role-ai'    :
        role === 'agent'         ? 'role-agent' : 'role-user';

      const avatarLabel =
        role === 'user'      ? 'U' :
        role === 'assistant' ? 'AI' :
        role === 'agent'     ? 'AG' : '?';

      const wrap = document.createElement('div');
      wrap.className = 'msg ' + roleClass;
      wrap.innerHTML =
        '<div class="msg-avatar">' + avatarLabel + '</div>' +
        '<div class="msg-meta">' +
          '<div class="msg-bubble">' + escHtml(msg.messageContent || '(trống)') + '</div>' +
          '<div class="msg-time">' + formatDate(msg.createDate) + '</div>' +
        '</div>';

      container.appendChild(wrap);
    });
  }

  $('btnLoadMore').addEventListener('click', () => {
    state.detail.page++;
    loadMessages();
  });

  btnBack.addEventListener('click', () => {
    detailView.style.display = 'none';
    listView.style.display   = 'block';
    btnBack.classList.remove('visible');
    pageTitle.textContent = 'Lịch sử hội thoại AI';
  });

  // ── Escape HTML ──
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Init ──
  loadConversations();
</script>
</body>
</html>
