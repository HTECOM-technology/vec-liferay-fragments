buildscript {
    dependencies {
        classpath group: "com.liferay", name: "com.liferay.gradle.plugins", version: "latest.release"
    }
    repositories {
        maven {
            url "https://repository-cdn.liferay.com/nexus/content/groups/public"
        }
    }
}

apply plugin: "com.liferay.plugin"

def liferayHome = System.getenv("LIFERAY_HOME") ?: "/root/vec/bundles"

repositories {
    maven {
        url "https://repository-cdn.liferay.com/nexus/content/groups/public"
    }
}

dependencies {
    compileOnly files("${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/portal-kernel.jar")
    compileOnly files("${liferayHome}/tomcat/lib/servlet-api.jar")
    compileOnly files("${rootDir}/../libs/osgi-annotations.jar")

    // Cho phép compile local khi không có full Liferay bundle. Trên server vẫn
    // ưu tiên đúng các JAR trong LIFERAY_HOME như trước.
    if (!file("${liferayHome}/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/portal-kernel.jar").exists()) {
        compileOnly group: "com.liferay.portal", name: "release.portal.api", version: "7.4.3.132"
    }

    compileOnly group: "javax.ws.rs", name: "javax.ws.rs-api", version: "2.1"
    compileOnly group: "javax.servlet", name: "javax.servlet-api", version: "3.1.0"
    compileOnly group: "org.osgi", name: "org.osgi.core", version: "6.0.0"
    compileOnly group: "org.osgi", name: "org.osgi.service.cm", version: "1.6.0"
}

tasks.named("buildCSS").configure { enabled = false }
tasks.named("copyCSS").configure { enabled = false }
